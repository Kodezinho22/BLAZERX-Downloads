name: Publish ESTUDEX v1.9.3 Hotfix 32 Room Performance

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/prepare-estudex-v1.9.3-hotfix32.yml'
      - 'hotfixes/v1.9.36-hotfix32/**'

permissions:
  contents: write

jobs:
  build-publish:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      BASE_TAG: v1.9.35-hotfix31
      RELEASE_TAG: v1.9.36-hotfix32
      BASE_SETUP_SHA256: fbcb3117049019cc0400ffa0b67541f4311df53234e3b0f00dd59ae9141f8c73
      BACKEND_BASE: https://site--estudex-server--bs292kkyk4sm.code.run

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify live ESTUDEX backend 0.3.7+
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          @'
          const base=process.env.BACKEND_BASE;
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          (async()=>{
            let health=null;
            for(let i=1;i<=8;i++){
              try{
                const r=await fetch(base+'/health',{cache:'no-store'});const d=await r.json();
                if(r.ok&&d.ok&&['0.3.7','0.3.8'].includes(d.version)&&d.socialPersistence==='parse'){health=d;break;}
                console.log('backend not ready',i,d.version,d.socialPersistence);
              }catch(e){console.log('health failed',i,e.message)}
              await sleep(5000);
            }
            if(!health)throw new Error('Backend 0.3.7+ + Parse did not become ready');
            const liveRes=await fetch(base+'/api/rooms/live',{cache:'no-store'});const live=await liveRes.json();
            if(!liveRes.ok||live.ok!==true||!Array.isArray(live.rooms))throw new Error('Live room directory unavailable');
            console.log('Backend ready:',health.version,'rooms=',health.rooms,'directory=',live.rooms.length);
          })().catch(e=>{console.error(e);process.exit(1)});
          '@ | Set-Content verify-backend-hotfix32.cjs -Encoding utf8
          node verify-backend-hotfix32.cjs

      - name: Download and verify Hotfix 31 baseline
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          gh release download $env:BASE_TAG --repo Kodezinho22/BLAZERX-Downloads --pattern 'ESTUDEX-Setup.exe'
          $hash=(Get-FileHash 'ESTUDEX-Setup.exe' -Algorithm SHA256).Hash.ToLowerInvariant()
          if($hash -ne $env:BASE_SETUP_SHA256){throw "Hotfix31 baseline SHA mismatch: $hash"}
          Write-Host "Verified Hotfix31 installer: $hash"

      - name: Recover exact published Hotfix 31 application
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force -Path base-setup,base-nupkg,app | Out-Null
          & 7z x 'ESTUDEX-Setup.exe' '-obase-setup' -y | Out-Null
          $nupkg=Get-ChildItem base-setup -Recurse -Filter 'blazerx-1.9.35-full.nupkg' | Select-Object -First 1
          if(-not $nupkg){throw 'Hotfix31 nupkg not found'}
          & 7z x $nupkg.FullName '-obase-nupkg' -y | Out-Null
          $asar=Get-ChildItem base-nupkg -Recurse -Filter app.asar | Select-Object -First 1
          if(-not $asar){throw 'Hotfix31 app.asar not found'}
          npx --yes @electron/asar extract $asar.FullName app
          node hotfixes/v1.9.35-hotfix31/contract.cjs app
          $baseHomeJs=(Get-FileHash 'app/public/js/home.js' -Algorithm SHA256).Hash.ToLowerInvariant()
          $baseHomeCss=(Get-FileHash 'app/public/css/home.css' -Algorithm SHA256).Hash.ToLowerInvariant()
          "BASE_HOME_JS=$baseHomeJs" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "BASE_HOME_CSS=$baseHomeCss" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Apply Hotfix 32 room performance patch
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          node hotfixes/v1.9.36-hotfix32/patch.cjs app
          node --check app/public/js/estudex-v193-cloud-social-v1926.js
          node --check app/public/estudex-engine.js
          node --check app/public/js/estudex-engine-socket-compat.js
          node --check app/public/js/home.js
          node --check app/main.js
          node --check app/preload.js
          node hotfixes/v1.9.36-hotfix32/contract.cjs app
          $homeJs=(Get-FileHash 'app/public/js/home.js' -Algorithm SHA256).Hash.ToLowerInvariant()
          $homeCss=(Get-FileHash 'app/public/css/home.css' -Algorithm SHA256).Hash.ToLowerInvariant()
          if($homeJs -ne $env:BASE_HOME_JS){throw 'Canonical V10.10 home.js changed'}
          if($homeCss -ne $env:BASE_HOME_CSS){throw 'Canonical V10.10 home.css changed'}

      - name: Install build dependencies
        shell: pwsh
        working-directory: app
        run: |
          $ErrorActionPreference='Stop'
          if(Test-Path node_modules){Remove-Item node_modules -Recurse -Force}
          npm install --no-audit --no-fund

      - name: Build ESTUDEX technical revision 1.9.36
        shell: pwsh
        working-directory: app
        run: |
          $ErrorActionPreference='Stop'
          npx electron-forge make --platform=win32 --arch=x64

      - name: Verify final Hotfix 32 package
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force -Path dist,verify-nupkg,verify-app | Out-Null
          $setup=Get-ChildItem 'app/out/make' -Recurse -Filter 'ESTUDEX-Setup.exe' | Select-Object -First 1
          $nupkg=Get-ChildItem 'app/out/make' -Recurse -Filter 'blazerx-1.9.36-full.nupkg' | Select-Object -First 1
          if(-not $setup){throw 'ESTUDEX-Setup.exe was not generated'}
          if(-not $nupkg){throw 'blazerx-1.9.36-full.nupkg was not generated'}
          Copy-Item $setup.FullName 'dist/ESTUDEX-Setup.exe' -Force
          Copy-Item $setup.FullName 'dist/BLAZERX-Setup.exe' -Force
          Copy-Item $nupkg.FullName 'dist/blazerx-1.9.36-full.nupkg' -Force
          & 7z x $nupkg.FullName '-overify-nupkg' -y | Out-Null
          $asar=Get-ChildItem verify-nupkg -Recurse -Filter app.asar | Select-Object -First 1
          if(-not $asar){throw 'Final app.asar missing'}
          npx --yes @electron/asar extract $asar.FullName verify-app
          node hotfixes/v1.9.36-hotfix32/contract.cjs verify-app
          $homeJs=(Get-FileHash 'verify-app/public/js/home.js' -Algorithm SHA256).Hash.ToLowerInvariant()
          $homeCss=(Get-FileHash 'verify-app/public/css/home.css' -Algorithm SHA256).Hash.ToLowerInvariant()
          if($homeJs -ne $env:BASE_HOME_JS){throw 'Packaged V10.10 home.js changed'}
          if($homeCss -ne $env:BASE_HOME_CSS){throw 'Packaged V10.10 home.css changed'}
          $setupHash=(Get-FileHash 'dist/ESTUDEX-Setup.exe' -Algorithm SHA256).Hash.ToLowerInvariant()
          "SETUP_SHA256=$setupHash" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "ESTUDEX Hotfix32 installer SHA-256: $setupHash"

      - uses: actions/upload-artifact@v4
        with:
          name: ESTUDEX-v1.9.3-Hotfix32-Room-Performance
          path: |
            dist/ESTUDEX-Setup.exe
            dist/BLAZERX-Setup.exe
            dist/blazerx-1.9.36-full.nupkg
          retention-days: 14
          if-no-files-found: error

      - name: Publish ESTUDEX v1.9.3 Hotfix 32
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          gh release view $env:RELEASE_TAG --repo Kodezinho22/BLAZERX-Downloads *> $null
          if($LASTEXITCODE -eq 0){throw "Release $env:RELEASE_TAG already exists; refusing to overwrite"}
          $notes=@"
          ESTUDEX v1.9.3 — Hotfix 32 Room Performance

          Revisão técnica 1.9.36, construída diretamente sobre o Hotfix 31 publicado e verificado.

          Mudanças principais:
          - criação de sala responde imediatamente na interface e bloqueia clique duplicado durante a criação;
          - primeira tentativa de reconnect é imediata, removendo a espera artificial de 650 ms;
          - uma conexão nova não executa um leave desnecessário quando não existe sala/socket ativo;
          - voltar para a sala já conectada continua usando o fast path local, sem reconstruir a conexão;
          - lista de salas salvas não faz mais uma consulta de status por sala; em backend 0.3.7 usa uma única consulta ao diretório ao vivo e 0.3.8 suporta status inline;
          - sessão/@ já salvo não é apagado por timeout, rede ou erro temporário do backend na inicialização;
          - backend 0.3.7+ mantém no máximo uma sala hospedada ativa por usuário autenticado; nova sala substitui a anterior;
          - preserva o Hotfix 31 e o home.js/home.css canônico V10.10.

          Backend mínimo validado no build: ESTUDEX Server v0.3.7 / Back4App Parse
          Backend 0.3.8 já contém otimizações adicionais de sessão/status e é compatível com este cliente.
          Produto: ESTUDEX v1.9.3
          Revisão técnica: 1.9.36
          Base verificada: v1.9.35-hotfix31

          SHA-256 do instalador:
          $env:SETUP_SHA256
          "@
          Set-Content release-notes-hotfix32.txt $notes -Encoding utf8
          gh release create $env:RELEASE_TAG 'dist/ESTUDEX-Setup.exe' 'dist/BLAZERX-Setup.exe' --repo Kodezinho22/BLAZERX-Downloads --target main --title 'ESTUDEX v1.9.3 — Hotfix 32 Room Performance' --notes-file release-notes-hotfix32.txt --latest
