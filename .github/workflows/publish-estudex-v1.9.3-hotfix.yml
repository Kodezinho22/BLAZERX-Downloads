name: Publish ESTUDEX v1.9.3 Hotfix 9

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-estudex-v1.9.3-hotfix.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ARTIFACT_URL: "https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-c6ac-820e-b3d3-bd26269f4904/raw?se=2026-09-08T21%3A56%3A19Z&sp=r&sv=2026-02-06&sr=b&scid=14e84ae1-d34e-53a1-8699-6842f48fa0e4&skoid=a6356955-0ca0-4033-9150-c0c162458498&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-08T19%3A16%3A55Z&ske=2026-09-09T19%3A16%3A55Z&sks=b&skv=2026-02-06&sig=Tw1IrZ/6n1OEzsopczHKp89yKBf%2B0ye6x/xAtV0/vSI%3D"
      ARTIFACT_SHA256: be5474c9c4082f2697883f170bcdd991232bbc0daa0531866f237beb679138be
      SETUP_SHA256: b271fbaa4bf8d5a6d461c0ff807364e69ace2d2dbd3e0bc2a9c556aac08ec3a8
      RELEASE_TAG: v1.9.13-hotfix9

    steps:
      - uses: actions/checkout@v4

      - name: Download and verify Hotfix 9
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 "$ARTIFACT_URL" -o artifact.zip
          echo "$ARTIFACT_SHA256  artifact.zip" | sha256sum -c -
          mkdir artifact
          unzip -q artifact.zip -d artifact
          count="$(find artifact -type f -name 'ESTUDEX-Setup.exe' | wc -l | tr -d ' ')"
          test "$count" = "1"
          setup="$(find artifact -type f -name 'ESTUDEX-Setup.exe' -print -quit)"
          echo "$SETUP_SHA256  $setup" | sha256sum -c -
          cp "$setup" ESTUDEX-Setup.exe
          cp "$setup" BLAZERX-Setup.exe

      - name: Publish ESTUDEX v1.9.3 Hotfix 9
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          notes=$(cat <<'EOF'
          ESTUDEX v1.9.3 — Hotfix 9

          Nono hotfix cumulativo da v1.9.3.

          Corrige e consolida:
          - persistência nativa real de foto de perfil, banner e imagem de fundo do lobby no aplicativo empacotado;
          - gravações parciais ou vazias do perfil passam a preservar avatar e banner já salvos, evitando regressão após reinício ou atualização;
          - Aceitar/Recusar solicitações pendentes usa diretamente o requestId já renderizado e conclui a decisão local sem depender de listPending, Radmin ou disponibilidade do peer;
          - tombstone e remoção visual da solicitação acontecem localmente antes da sincronização remota, que segue em segundo plano e em melhor esforço;
          - solicitações pendentes começam Offline e só aparecem Online após prova atual e verificada do transporte Radmin;
          - preserva cumulativamente os reparos anteriores de amizade, presença, salas, transmissão, WebRTC, updater e estabilidade.

          A V10.10 original permanece como autoridade visual absoluta. home.js e home.css canônicos continuam preservados byte por byte.

          Revisão técnica do pacote/updater: 1.9.13
          Identidade Squirrel preservada: blazerx

          SHA-256 do instalador:
          b271fbaa4bf8d5a6d461c0ff807364e69ace2d2dbd3e0bc2a9c556aac08ec3a8
          EOF
          )
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" ESTUDEX-Setup.exe BLAZERX-Setup.exe --clobber
            gh release edit "$RELEASE_TAG" --title "ESTUDEX v1.9.3 — Hotfix 9" --notes "$notes" --latest
          else
            gh release create "$RELEASE_TAG" ESTUDEX-Setup.exe BLAZERX-Setup.exe --target main --title "ESTUDEX v1.9.3 — Hotfix 9" --notes "$notes" --latest
          fi
