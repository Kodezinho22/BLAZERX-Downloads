name: Publish ESTUDEX v1.9.3 Hotfix 12

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-estudex-v1.9.3-hotfix.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ARTIFACT_URL: "https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-f83c-820e-9933-adb1db92f45d/raw?se=2026-09-13T20%3A06%3A29Z&sp=r&sv=2026-02-06&sr=b&scid=029f8e37-8f72-5e84-8fea-cc26db29cbf3&skoid=4a431cd2-eafd-49c7-90be-bbb4d45e696d&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-13T12%3A23%3A36Z&ske=2026-09-14T12%3A23%3A36Z&sks=b&skv=2026-02-06&sig=g9L56zJO%2BARI7fOyTBeHP6O3C5CRxcmKdrhqfdDr7Wo%3D"
      ARTIFACT_SHA256: 2936780482e659872351e3289bbd043ea215019d88e3eb5fe3a6c538ad2b5805
      SETUP_SHA256: 24362d99d6b45c59dd8d85f69bb74ea5257249f3adc4fc35dbf9b8d8510a39e2
      RELEASE_TAG: v1.9.16-hotfix12

    steps:
      - uses: actions/checkout@v4

      - name: Download and verify Hotfix 12
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 "$ARTIFACT_URL" -o artifact.zip
          echo "$ARTIFACT_SHA256  artifact.zip" | sha256sum -c -
          mkdir artifact
          unzip -q artifact.zip -d artifact
          count="$(find artifact -type f -name 'ESTUDEX-Setup.exe' | wc -l | tr -d ' ')"
          test "$count" = "1"
          setup="$(find artifact -type f -name 'ESTUDEX-Setup.exe' -print -quit)"
          echo "$SETUP_SHA256  $setup" | sha256sum -c -
          cp "$setup" ESTUDEX-Setup.exe
          cp "$setup" BLAZERX-Setup.exe

      - name: Publish ESTUDEX v1.9.3 Hotfix 12
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          notes=$(cat <<'EOF'
          ESTUDEX v1.9.3 — Hotfix 12

          Décimo segundo hotfix cumulativo da v1.9.3, republicado após auditoria técnica da revisão 1.9.16.

          Corrige e consolida:
          - corrige definitivamente o clique real em Aceitar/Recusar no menu de pedidos pendentes;
          - impede click-through após o fechamento do menu e adiciona regressão comportamental para esse fluxo;
          - remove o bloqueio invisível causado pelo friendMenuBackdrop, preservando fechamento seguro ao clicar fora;
          - reforça a prontidão do Radmin: adaptador/IP sozinho não significa conexão pronta;
          - exige link Radmin 26.x válido, servidor local ESTUDEX pronto e validação de firewall/rede antes do estado verde;
          - não mascara mais falhas de inicialização do servidor local do ESTUDEX;
          - protege o heartbeat social contra execuções sobrepostas;
          - mantém presença Invisível coerente sem promover peers para online à força;
          - preserva requestId exato, remoção local imediata, tombstone persistente e sincronização remota em segundo plano;
          - mantém persistência nativa de avatar, banner e wallpaper após reinício/atualização;
          - preserva cumulativamente os reparos anteriores de amizade, presença, salas, transmissão, WebRTC, updater e estabilidade.

          A revisão foi reconstruída do zero e validada no GitHub Actions com todos os contratos cumulativos e Hotfix 12 aprovados.

          A V10.10 original permanece como autoridade visual absoluta. home.js e home.css canônicos continuam preservados byte por byte.

          Revisão técnica do pacote/updater: 1.9.16
          Identidade Squirrel preservada: blazerx
          Commit validado: bc78ebcd4dcfda0b44937dc2ffaca39c9c1686cf

          SHA-256 do instalador:
          24362d99d6b45c59dd8d85f69bb74ea5257249f3adc4fc35dbf9b8d8510a39e2
          EOF
          )
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" ESTUDEX-Setup.exe BLAZERX-Setup.exe --clobber
            gh release edit "$RELEASE_TAG" --title "ESTUDEX v1.9.3 — Hotfix 12" --notes "$notes" --latest
          else
            gh release create "$RELEASE_TAG" ESTUDEX-Setup.exe BLAZERX-Setup.exe --target main --title "ESTUDEX v1.9.3 — Hotfix 12" --notes "$notes" --latest
          fi
