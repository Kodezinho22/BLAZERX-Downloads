name: Publish ESTUDEX v1.9.3 Hotfix 2

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-estudex-v1.9.3-hotfix.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ARTIFACT_URL: "https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-2968-820e-9004-7354b3e6bd97/raw?se=2026-08-29T07%3A55%3A45Z&sp=r&sv=2026-02-06&sr=b&scid=d2612abf-e549-5b3b-8bc7-687673c52f94&skoid=4a431cd2-eafd-49c7-90be-bbb4d45e696d&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-28T20%3A45%3A58Z&ske=2026-08-29T20%3A45%3A58Z&sks=b&skv=2026-02-06&sig=6r5RMzohVnSDKw4A6ex7wa1pYd%2BY9ClR7at8ddzekeg%3D"
      ARTIFACT_SHA256: 40fea0008abe577255ea31d5e5ceabe70d34f551c63d6762021afd4be7ee3508
      SETUP_SHA256: 39ba06169de5edfabe1afe2c6be81fc36d4248e9a081627c23b893e9fc5560ab
      RELEASE_TAG: v1.9.5-hotfix2

    steps:
      - uses: actions/checkout@v4

      - name: Download and verify Hotfix 2
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 "$ARTIFACT_URL" -o artifact.zip
          echo "$ARTIFACT_SHA256  artifact.zip" | sha256sum -c -
          mkdir artifact
          unzip -q artifact.zip -d artifact
          setup="$(find artifact -type f -name 'ESTUDEX-Setup.exe' -print -quit)"
          test -n "$setup"
          echo "$SETUP_SHA256  $setup" | sha256sum -c -
          cp "$setup" ESTUDEX-Setup.exe
          cp "$setup" BLAZERX-Setup.exe

      - name: Publish ESTUDEX v1.9.3 Hotfix 2
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          notes=$(cat <<'EOF'
          ESTUDEX v1.9.3 — Hotfix 2

          Segundo hotfix cumulativo da v1.9.3.

          Corrige:
          - perfil já salvo abrindo direto no ESTUDEX, sem exigir recriação a cada inicialização;
          - remoção dos textos antigos de “perfil de teste”;
          - botão Convidar conectado ao fluxo real de amigos e convites de sala;
          - convite recebido com ações Entrar / Recusar;
          - encerramento de sala em uma única operação, com proteção contra cliques/races duplicados;
          - salas fantasmas/duplicadas após encerramento;
          - preserva as correções do Hotfix 1 para presença, Radmin, endpoints antigos e entrada em salas.

          A V10.10 permanece como autoridade visual e os arquivos canônicos protegidos continuam preservados.

          SHA-256 do instalador:
          39ba06169de5edfabe1afe2c6be81fc36d4248e9a081627c23b893e9fc5560ab
          EOF
          )
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" ESTUDEX-Setup.exe BLAZERX-Setup.exe --clobber
            gh release edit "$RELEASE_TAG" --title "ESTUDEX v1.9.3 — Hotfix 2" --notes "$notes" --latest
          else
            gh release create "$RELEASE_TAG" ESTUDEX-Setup.exe BLAZERX-Setup.exe --target main --title "ESTUDEX v1.9.3 — Hotfix 2" --notes "$notes" --latest
          fi
