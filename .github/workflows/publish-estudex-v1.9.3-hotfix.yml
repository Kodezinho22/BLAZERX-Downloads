name: Publish ESTUDEX v1.9.3 Hotfix 5

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-estudex-v1.9.3-hotfix.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ARTIFACT_URL: "https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-3ce4-820e-af39-2df61709bea1/raw?se=2026-09-08T02%3A52%3A25Z&sp=r&sv=2026-02-06&sr=b&scid=d20033ee-df53-55c7-a9db-f7bf672e8b5d&skoid=a6356955-0ca0-4033-9150-c0c162458498&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-07T14%3A29%3A25Z&ske=2026-09-08T14%3A29%3A25Z&sks=b&skv=2026-02-06&sig=B8kLk9THanBEYGLWXBzjAk2bhLxNoldFqWRfjV1nl%2Bg%3D"
      ARTIFACT_SHA256: 4ad5ec9d33368d2c91202aa37395e1a8dd9eb1747f8f05d4c005c3d45e837ba2
      SETUP_SHA256: 14930b0e30a824a48a48884e790634237901bd7d8a41d3b630f98376605c169c
      RELEASE_TAG: v1.9.8-hotfix5

    steps:
      - uses: actions/checkout@v4

      - name: Download and verify Hotfix 5
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 "$ARTIFACT_URL" -o artifact.zip
          echo "$ARTIFACT_SHA256  artifact.zip" | sha256sum -c -
          mkdir artifact
          unzip -q artifact.zip -d artifact
          count="$(find artifact -type f -name 'ESTUDEX-Setup.exe' | wc -l | tr -d ' ')"
          test "$count" = "1"
          setup="$(find artifact -type f -name 'ESTUDEX-Setup.exe' -print -quit)"
          echo "$SETUP_SHA256  $setup" | sha256sum -c -
          cp "$setup" ESTUDEX-Setup.exe
          cp "$setup" BLAZERX-Setup.exe

      - name: Publish ESTUDEX v1.9.3 Hotfix 5
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          notes=$(cat <<'EOF'
          ESTUDEX v1.9.3 — Hotfix 5

          Quinto hotfix cumulativo da v1.9.3.

          Corrige e consolida:
          - pedidos de amizade e lista social deixam de duplicar o mesmo usuário entre Pendentes e Pessoas na rede;
          - aceitar/recusar amizade usa sincronização mais segura e retries menores;
          - remover amigo tenta sincronizar a remoção nos dois peers quando o outro usuário está alcançável;
          - bloqueio passa a barrar pedidos pendentes, chamadas e outras interações no cliente;
          - convites ficam vinculados à combinação sala + amigo, evitando estado Convidado preso entre salas diferentes;
          - presença e polling social/Radmin são coalescidos para reduzir travamentos, redesenhos e salas piscando;
          - endpoints antigos de amigos e salas são reconciliados com os peers Radmin atuais;
          - Radmin só é considerado pronto com conexão real e IP 26.x válido, sem promover adaptador isolado para conectado;
          - entrada em sala recebe tolerância maior para Radmin frio, mantendo recuperação por endpoint conhecido;
          - transmissão de tela/janela passa a ser vídeo-only e não captura áudio do desktop/Discord;
          - chamada direta e transmissão ganham recuperação de desconexão com ICE restart/retry limitado;
          - mídia já ativa é ofertada imediatamente a novos espectadores e ofertas duplicadas são coalescidas;
          - testes de microfone/câmera são encerrados ao sair das configurações;
          - a interface deixa de anunciar volume de saída acima de 100% quando o motor não oferece ganho real acima desse limite;
          - identidade Squirrel/registro/desinstalação permanece coerente com blazerx, preservando a continuidade do updater;
          - a validação pré-release agora propaga falhas de comandos Node/PowerShell e verifica novamente os invariantes após o hardening final.

          A V10.10 original permanece como autoridade visual absoluta. home.js, home.css e assets canônicos continuam preservados.

          Revisão técnica do pacote/updater: 1.9.8
          Identidade Squirrel preservada: blazerx

          SHA-256 do instalador:
          14930b0e30a824a48a48884e790634237901bd7d8a41d3b630f98376605c169c
          EOF
          )
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" ESTUDEX-Setup.exe BLAZERX-Setup.exe --clobber
            gh release edit "$RELEASE_TAG" --title "ESTUDEX v1.9.3 — Hotfix 5" --notes "$notes" --latest
          else
            gh release create "$RELEASE_TAG" ESTUDEX-Setup.exe BLAZERX-Setup.exe --target main --title "ESTUDEX v1.9.3 — Hotfix 5" --notes "$notes" --latest
          fi
