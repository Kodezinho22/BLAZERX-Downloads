name: Publish ESTUDEX v1.9.3 Hotfix 12

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-estudex-v1.9.3-hotfix.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ARTIFACT_URL: "https://sdmntprkoreacentral.oaiusercontent.com/files/00000000-3968-8206-be59-df437f6e3dba/raw?se=2026-09-09T16%3A01%3A45Z&sp=r&sv=2026-02-06&sr=b&scid=6f66758e-fbbc-53ce-9139-c0178d5fadd6&skoid=a6356955-0ca0-4033-9150-c0c162458498&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-09T15%3A02%3A26Z&ske=2026-09-10T15%3A02%3A26Z&sks=b&skv=2026-02-06&sig=i1EQFAv8GkGJj/cTe0Y%2Bsb1gU4eypa3HJ475VgZS7/k%3D"
      ARTIFACT_SHA256: d74f3fe40258f583edd37bb429513b9326ad67f3add3fdbc841447b678d67f01
      SETUP_SHA256: bc8e0f8830a0134cc79e6a639a4722c92a6f4913b8c3354865b3193eb00f9a2a
      RELEASE_TAG: v1.9.16-hotfix12

    steps:
      - uses: actions/checkout@v4

      - name: Download and verify Hotfix 12
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 "$ARTIFACT_URL" -o artifact.zip
          echo "$ARTIFACT_SHA256  artifact.zip" | sha256sum -c -
          mkdir artifact
          unzip -q artifact.zip -d artifact
          count="$(find artifact -type f -name 'ESTUDEX-Setup.exe' | wc -l | tr -d ' ')"
          test "$count" = "1"
          setup="$(find artifact -type f -name 'ESTUDEX-Setup.exe' -print -quit)"
          echo "$SETUP_SHA256  $setup" | sha256sum -c -
          cp "$setup" ESTUDEX-Setup.exe
          cp "$setup" BLAZERX-Setup.exe

      - name: Publish ESTUDEX v1.9.3 Hotfix 12
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          notes=$(cat <<'EOF'
          ESTUDEX v1.9.3 — Hotfix 12

          Décimo segundo hotfix cumulativo da v1.9.3.

          Corrige e consolida:
          - corrige definitivamente o clique real em Aceitar/Recusar no menu de pedidos pendentes;
          - remove o bloqueio invisível causado pelo friendMenuBackdrop, que possuía prioridade de hit-test acima da página de Amigos apesar de o menu continuar visível;
          - o backdrop deixa de capturar o ponteiro sobre o menu, mantendo fechamento seguro ao clicar fora;
          - preserva requestId exato, remoção local imediata, tombstone persistente e sincronização remota em segundo plano;
          - mantém presença de pendentes Offline até existir prova Radmin atual da identidade exata;
          - mantém persistência nativa de avatar, banner e wallpaper após reinício/atualização;
          - preserva cumulativamente os reparos anteriores de amizade, presença, salas, transmissão, WebRTC, updater e estabilidade.

          Esta revisão foi validada no app empacotado e confirmada em teste real do ESTUDEX instalado.

          A V10.10 original permanece como autoridade visual absoluta. home.js e home.css canônicos continuam preservados byte por byte.

          Revisão técnica do pacote/updater: 1.9.16
          Identidade Squirrel preservada: blazerx

          SHA-256 do instalador:
          bc8e0f8830a0134cc79e6a639a4722c92a6f4913b8c3354865b3193eb00f9a2a
          EOF
          )
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" ESTUDEX-Setup.exe BLAZERX-Setup.exe --clobber
            gh release edit "$RELEASE_TAG" --title "ESTUDEX v1.9.3 — Hotfix 12" --notes "$notes" --latest
          else
            gh release create "$RELEASE_TAG" ESTUDEX-Setup.exe BLAZERX-Setup.exe --target main --title "ESTUDEX v1.9.3 — Hotfix 12" --notes "$notes" --latest
          fi
