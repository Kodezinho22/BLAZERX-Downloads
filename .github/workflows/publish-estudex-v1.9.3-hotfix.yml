name: Publish ESTUDEX v1.9.3 Hotfix 3

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-estudex-v1.9.3-hotfix.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ARTIFACT_URL: "https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-1108-820e-9443-1c61322c6856/raw?se=2026-08-29T08%3A42%3A11Z&sp=r&sv=2026-02-06&sr=b&scid=bddc7b0f-7e57-5d39-ad61-a0ea7b42c77b&skoid=4a431cd2-eafd-49c7-90be-bbb4d45e696d&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-28T21%3A03%3A09Z&ske=2026-08-29T21%3A03%3A09Z&sks=b&skv=2026-02-06&sig=EALRrkDAcq/pPIe6LtFoftxOVslNWq%2BsPj9TYXUSwkA%3D"
      ARTIFACT_SHA256: 158a505329b4e0eac2cb7d0d057269d55c7d5ba54380a2d0966e30e3d2975522
      SETUP_SHA256: 35fbe438f952880c842a6fb2352118940ef585ee8a188faf07075a1d61aaaa69
      RELEASE_TAG: v1.9.6-hotfix3

    steps:
      - uses: actions/checkout@v4

      - name: Download and verify Hotfix 3
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 "$ARTIFACT_URL" -o artifact.zip
          echo "$ARTIFACT_SHA256  artifact.zip" | sha256sum -c -
          mkdir artifact
          unzip -q artifact.zip -d artifact
          setup="$(find artifact -type f -name 'ESTUDEX-Setup.exe' -print -quit)"
          test -n "$setup"
          echo "$SETUP_SHA256  $setup" | sha256sum -c -
          cp "$setup" ESTUDEX-Setup.exe
          cp "$setup" BLAZERX-Setup.exe

      - name: Publish ESTUDEX v1.9.3 Hotfix 3
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          notes=$(cat <<'EOF'
          ESTUDEX v1.9.3 — Hotfix 3

          Terceiro hotfix cumulativo da v1.9.3.

          Corrige:
          - salas recém-criadas passam a aparecer imediatamente e permanecer estáveis em Minhas salas;
          - persistência local-first da sala, sem depender da reconciliação de rede para aparecer na interface;
          - sair de uma sala não apaga mais a sala salva;
          - proteção contra refresh fora de ordem que fazia a sala piscar, sumir ou reaparecer atrasada;
          - exclusão continua removendo a sala definitivamente;
          - entrada por Salas recentes agora tenta primeiro os dados/endpoints já salvos, sem descoberta Radmin ou timeout artificial antes da conexão;
          - descoberta/reconciliação Radmin fica como fallback quando o endpoint salvo estiver ausente ou realmente falhar;
          - clicar na mesma sala já conectada abre a sala sem ciclo desnecessário de desconexão/reconexão;
          - Ver todos de Salas ao vivo agora abre a página Salas focando as salas ao vivo;
          - Ver todos de Salas recentes agora abre a página Salas em Minhas salas/recentes;
          - Ver todos de Amigos online agora abre a página Amigos em Disponível;
          - preserva integralmente as correções dos Hotfixes 1 e 2 para Radmin, presença, amigos, perfil, convites, encerramento idempotente e salas fantasmas.

          A V10.10 original permanece como autoridade visual absoluta. home.js, home.css e os assets canônicos continuam preservados.

          Revisão técnica do pacote/updater: 1.9.6
          Identidade Squirrel preservada: blazerx

          SHA-256 do instalador:
          35fbe438f952880c842a6fb2352118940ef585ee8a188faf07075a1d61aaaa69
          EOF
          )
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" ESTUDEX-Setup.exe BLAZERX-Setup.exe --clobber
            gh release edit "$RELEASE_TAG" --title "ESTUDEX v1.9.3 — Hotfix 3" --notes "$notes" --latest
          else
            gh release create "$RELEASE_TAG" ESTUDEX-Setup.exe BLAZERX-Setup.exe --target main --title "ESTUDEX v1.9.3 — Hotfix 3" --notes "$notes" --latest
          fi
