name: Inspect Hotfix 17 network path

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/inspect-h17-network.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Recover Hotfix 17 app
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          gh release download v1.9.21-hotfix17 --repo Kodezinho22/BLAZERX-Downloads --pattern 'ESTUDEX-Setup.exe'
          New-Item -ItemType Directory -Force -Path setup,nupkg,app | Out-Null
          & 7z x ESTUDEX-Setup.exe '-osetup' -y | Out-Null
          $pkg=Get-ChildItem setup -Recurse -Filter 'blazerx-1.9.21-full.nupkg' | Select-Object -First 1
          if(-not $pkg){throw 'nupkg missing'}
          & 7z x $pkg.FullName '-onupkg' -y | Out-Null
          $asar=Get-ChildItem nupkg -Recurse -Filter app.asar | Select-Object -First 1
          if(-not $asar){throw 'asar missing'}
          npx --yes @electron/asar extract $asar.FullName app
      - name: Print network internals
        shell: pwsh
        run: |
          $patterns=@(
            'function isRadminSocketV122',
            'async function estudexRadminUiIpsV196',
            'async function estudexRadminSystemIpsV196',
            'async function estudexRadminNeighborIpsV170',
            'function estudexCandidateIpV196',
            'server.listen(',
            'listen(8787',
            '0.0.0.0',
            '127.0.0.1',
            'ESTUDEX_SOCIAL_PORT',
            'netsh advfirewall',
            'firewall'
          )
          foreach($p in $patterns){
            Write-Host "===== SERVER PATTERN: $p ====="
            Select-String -Path 'app/server.js' -Pattern $p -SimpleMatch -Context 12,100 | Select-Object -First 4 | ForEach-Object { $_.Context.PreContext; $_.Line; $_.Context.PostContext; '---' }
          }
          foreach($p in @('server.js','8787','firewall','netsh')){
            Write-Host "===== MAIN PATTERN: $p ====="
            Select-String -Path 'app/main.js' -Pattern $p -SimpleMatch -Context 12,80 | Select-Object -First 6 | ForEach-Object { $_.Context.PreContext; $_.Line; $_.Context.PostContext; '---' }
          }
