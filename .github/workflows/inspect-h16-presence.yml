name: Inspect Hotfix 16 presence

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/inspect-h16-presence.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Recover Hotfix 16 app
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          gh release download v1.9.20-hotfix16 --repo Kodezinho22/BLAZERX-Downloads --pattern 'ESTUDEX-Setup.exe'
          New-Item -ItemType Directory -Force -Path setup,nupkg,app | Out-Null
          & 7z x ESTUDEX-Setup.exe '-osetup' -y | Out-Null
          $pkg=Get-ChildItem setup -Recurse -Filter 'blazerx-1.9.20-full.nupkg' | Select-Object -First 1
          if(-not $pkg){throw 'nupkg missing'}
          & 7z x $pkg.FullName '-onupkg' -y | Out-Null
          $asar=Get-ChildItem nupkg -Recurse -Filter app.asar | Select-Object -First 1
          if(-not $asar){throw 'asar missing'}
          npx --yes @electron/asar extract $asar.FullName app
      - name: Print exact presence merge functions
        shell: pwsh
        run: |
          foreach($p in @('async function refreshFriendPresence','function reconcileFriendEndpointsV194','async function listPeers','async function freshLanPeersV194','function healStoredFriendEndpointV194')){
            Write-Host "===== ENGINE: $p ====="
            Select-String -Path 'app/public/estudex-engine.js' -Pattern $p -SimpleMatch -Context 5,90 | Select-Object -First 2 | ForEach-Object { $_.Context.PreContext; $_.Line; $_.Context.PostContext; '---' }
          }
          foreach($p in @('function estudexRadminLocalFileIpsV196','async function estudexRadminCandidateIpsV196','if (url.pathname === ''/api/social/lan-peers''')){
            Write-Host "===== SERVER: $p ====="
            Select-String -Path 'app/server.js' -Pattern $p -SimpleMatch -Context 5,90 | Select-Object -First 2 | ForEach-Object { $_.Context.PreContext; $_.Line; $_.Context.PostContext; '---' }
          }
