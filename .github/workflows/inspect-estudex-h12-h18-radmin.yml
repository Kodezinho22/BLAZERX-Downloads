name: Inspect ESTUDEX H12 vs H18 Radmin LAN

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/inspect-estudex-h12-h18-radmin.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Recover H12 and H18 application sources
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          function Recover([string]$tag,[string]$version,[string]$out) {
            New-Item -ItemType Directory -Force -Path "$out-download","$out-setup","$out-nupkg",$out | Out-Null
            gh release download $tag --repo Kodezinho22/BLAZERX-Downloads --pattern 'ESTUDEX-Setup.exe' --dir "$out-download"
            & 7z x "$out-download/ESTUDEX-Setup.exe" "-o$out-setup" -y | Out-Null
            $pkg=Get-ChildItem "$out-setup" -Recurse -Filter "blazerx-$version-full.nupkg" | Select-Object -First 1
            if(-not $pkg){throw "$tag nupkg not found"}
            & 7z x $pkg.FullName "-o$out-nupkg" -y | Out-Null
            $asar=Get-ChildItem "$out-nupkg" -Recurse -Filter app.asar | Select-Object -First 1
            if(-not $asar){throw "$tag app.asar not found"}
            npx --yes @electron/asar extract $asar.FullName $out
          }
          Recover 'v1.9.16-hotfix12' '1.9.16' 'h12'
          Recover 'v1.9.22-hotfix18' '1.9.22' 'h18'

      - name: Print exact LAN/Radmin implementation landmarks
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          @'
          const fs=require('fs');
          function dump(file,label){
            const s=fs.readFileSync(file,'utf8');
            const terms=[
              'ESTUDEX_RADMIN_DIRECTORY_V170',
              'function estudexRadminIpV170',
              'async function estudexBrowseRadminUsersV170',
              'ESTUDEX_LAN_PRESENCE_V172',
              'function estudexLanStartV172',
              'async function estudexLanSnapshotV172',
              'socialDiscoveryResponderV112',
              'discoveryBroadcastsV112',
              "url.pathname === '/api/social/lan-peers'",
              "url.pathname === '/api/social/search'"
            ];
            console.log(`\n========== ${label} ==========`);
            for(const t of terms){
              const i=s.indexOf(t);
              console.log(`\n--- ${t} @ ${i} ---`);
              if(i>=0) console.log(s.slice(Math.max(0,i-1200),Math.min(s.length,i+6500)));
            }
          }
          dump('h12/server.js','HOTFIX 12');
          dump('h18/server.js','HOTFIX 18');
          '@ | Set-Content inspect.cjs -Encoding UTF8
          node inspect.cjs

      - name: Save source files as artifact
        uses: actions/upload-artifact@v4
        with:
          name: h12-h18-radmin-source
          path: |
            h12/server.js
            h12/public/estudex-engine.js
            h18/server.js
            h18/public/estudex-engine.js
          retention-days: 1
