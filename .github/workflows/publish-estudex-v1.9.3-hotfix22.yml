name: Publish ESTUDEX v1.9.3 Hotfix 22 Cloud Social

on:
  push:
    branches: [main]
    paths:
      - hotfixes/v1.9.26-hotfix22/**
      - .github/workflows/publish-estudex-v1.9.3-hotfix22.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-publish:
    runs-on: windows-latest
    timeout-minutes: 50
    env:
      BASE_TAG: v1.9.25-hotfix21
      RELEASE_TAG: v1.9.26-hotfix22
      BASE_SETUP_SHA256: 4be8ea0283483dd5bb8c4a8305859f8a79ba17b63db9deb1a30654faa186ec47

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Download and verify Hotfix 21 baseline
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          gh release download $env:BASE_TAG --repo Kodezinho22/BLAZERX-Downloads --pattern 'ESTUDEX-Setup.exe'
          $hash = (Get-FileHash 'ESTUDEX-Setup.exe' -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne $env:BASE_SETUP_SHA256) { throw "Hotfix 21 baseline SHA mismatch: $hash" }

      - name: Recover exact Hotfix 21 application source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path base-setup,base-nupkg,app | Out-Null
          & 7z x 'ESTUDEX-Setup.exe' '-obase-setup' -y | Out-Null
          $nupkg = Get-ChildItem base-setup -Recurse -Filter 'blazerx-1.9.25-full.nupkg' | Select-Object -First 1
          if (-not $nupkg) { throw 'Hotfix 21 nupkg not found inside published installer.' }
          & 7z x $nupkg.FullName '-obase-nupkg' -y | Out-Null
          $asar = Get-ChildItem base-nupkg -Recurse -Filter 'app.asar' | Select-Object -First 1
          if (-not $asar) { throw 'Hotfix 21 app.asar not found.' }
          npx --yes @electron/asar extract $asar.FullName app
          foreach ($required in @('server.js','main.js','preload.js','public/index.html','public/estudex-engine.js','public/js/estudex-engine-socket-compat.js','public/js/estudex-engine-data-bindings.js','public/js/estudex-v193-room-actions-hotfix.js','public/js/estudex-v193-spec-settings.js','public/js/home.js','public/css/home.css')) {
            if (-not (Test-Path (Join-Path 'app' $required))) { throw "Recovered app missing $required" }
          }
          node hotfixes/v1.9.25-hotfix21/contract.cjs app
          $baseHomeJs = (Get-FileHash 'app/public/js/home.js' -Algorithm SHA256).Hash.ToLowerInvariant()
          $baseHomeCss = (Get-FileHash 'app/public/css/home.css' -Algorithm SHA256).Hash.ToLowerInvariant()
          "BASE_HOME_JS=$baseHomeJs" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "BASE_HOME_CSS=$baseHomeCss" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Apply Hotfix 22 cloud social migration
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          node hotfixes/v1.9.26-hotfix22/patch.cjs app
          node --check app/server.js
          node --check app/main.js
          node --check app/preload.js
          node --check app/public/estudex-engine.js
          node --check app/public/js/estudex-v193-cloud-social-v1926.js
          node --check app/public/js/estudex-engine-socket-compat.js
          node --check app/public/js/estudex-engine-data-bindings.js
          node --check app/public/js/estudex-v193-room-actions-hotfix.js
          node --check app/public/js/estudex-v193-spec-settings.js
          node hotfixes/v1.9.26-hotfix22/contract.cjs app
          $homeJs = (Get-FileHash 'app/public/js/home.js' -Algorithm SHA256).Hash.ToLowerInvariant()
          $homeCss = (Get-FileHash 'app/public/css/home.css' -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($homeJs -ne $env:BASE_HOME_JS) { throw 'Canonical V10.10 home.js changed.' }
          if ($homeCss -ne $env:BASE_HOME_CSS) { throw 'Canonical V10.10 home.css changed.' }

      - name: Install build dependencies
        shell: pwsh
        working-directory: app
        run: |
          $ErrorActionPreference = 'Stop'
          if (Test-Path node_modules) { Remove-Item node_modules -Recurse -Force }
          npm install --no-audit --no-fund

      - name: Build ESTUDEX technical revision 1.9.26
        shell: pwsh
        working-directory: app
        run: |
          $ErrorActionPreference = 'Stop'
          npx electron-forge make --platform=win32 --arch=x64

      - name: Verify final package and cloud social migration
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path dist,verify-nupkg,verify-app | Out-Null
          $setup = Get-ChildItem 'app/out/make' -Recurse -Filter 'ESTUDEX-Setup.exe' | Select-Object -First 1
          $nupkg = Get-ChildItem 'app/out/make' -Recurse -Filter 'blazerx-1.9.26-full.nupkg' | Select-Object -First 1
          if (-not $setup) { throw 'ESTUDEX-Setup.exe was not generated.' }
          if (-not $nupkg) { throw 'blazerx-1.9.26-full.nupkg was not generated.' }
          Copy-Item $setup.FullName 'dist/ESTUDEX-Setup.exe' -Force
          Copy-Item $setup.FullName 'dist/BLAZERX-Setup.exe' -Force
          Copy-Item $nupkg.FullName 'dist/blazerx-1.9.26-full.nupkg' -Force
          & 7z x $nupkg.FullName '-overify-nupkg' -y | Out-Null
          $asar = Get-ChildItem verify-nupkg -Recurse -Filter 'app.asar' | Select-Object -First 1
          if (-not $asar) { throw 'Final app.asar missing from nupkg.' }
          npx --yes @electron/asar extract $asar.FullName verify-app
          node hotfixes/v1.9.26-hotfix22/contract.cjs verify-app
          $homeJs = (Get-FileHash 'verify-app/public/js/home.js' -Algorithm SHA256).Hash.ToLowerInvariant()
          $homeCss = (Get-FileHash 'verify-app/public/css/home.css' -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($homeJs -ne $env:BASE_HOME_JS) { throw 'Packaged V10.10 home.js changed.' }
          if ($homeCss -ne $env:BASE_HOME_CSS) { throw 'Packaged V10.10 home.css changed.' }
          $nuspec = Get-ChildItem verify-nupkg -Recurse -Filter 'blazerx.nuspec' | Select-Object -First 1
          if (-not $nuspec) { throw 'Final blazerx.nuspec missing.' }
          $nuspecText = Get-Content $nuspec.FullName -Raw
          if ($nuspecText -notmatch '<version>1\.9\.26</version>') { throw 'Final Squirrel package version is not 1.9.26.' }
          $setupHash = (Get-FileHash 'dist/ESTUDEX-Setup.exe' -Algorithm SHA256).Hash.ToLowerInvariant()
          "SETUP_SHA256=$setupHash" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "ESTUDEX Hotfix 22 installer SHA-256: $setupHash"

      - uses: actions/upload-artifact@v4
        with:
          name: ESTUDEX-v1.9.3-Hotfix22-Cloud-Social
          path: |
            dist/ESTUDEX-Setup.exe
            dist/BLAZERX-Setup.exe
            dist/blazerx-1.9.26-full.nupkg
          retention-days: 14
          if-no-files-found: error

      - name: Publish ESTUDEX v1.9.3 Hotfix 22 Cloud Social
        if: ${{ github.ref == 'refs/heads/main' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          gh release view $env:RELEASE_TAG --repo Kodezinho22/BLAZERX-Downloads *> $null
          if ($LASTEXITCODE -eq 0) { throw "Release $env:RELEASE_TAG already exists; refusing to overwrite a versioned update." }
          $notes = @"
          ESTUDEX v1.9.3 — Hotfix 22 Cloud Social

          Revisão técnica 1.9.26, construída diretamente sobre o Hotfix 21 publicado e verificado.

          Migração social online:
          - adiciona Entrar, Criar conta e Continuar como Guest;
          - Guest é persistente e pode ser convertido em conta mantendo o mesmo ID e dados;
          - adiciona busca de usuários pela internet, solicitações de amizade, bloqueios e presença;
          - DMs e convites de sala passam pelo backend ESTUDEX 0.3.0 + Back4App Parse;
          - chamadas privadas passam a usar sinalização cloud e STUN público;
          - salas salvas sincronizam com o backend quando há identidade autenticada;
          - remove as telas, aba de configurações e bridge do renderer dedicadas ao Radmin;
          - descoberta LAN antiga não é iniciada no cliente;
          - preserva as salas cloud do Hotfix 20 e o áudio de tela do Hotfix 21.

          Endpoint:
          - o cliente consulta config/estudex-cloud.json no GitHub para obter o backend atual;
          - existe fallback para o endpoint de teste atual, permitindo trocar a URL de teste sem recompilar o app quando a configuração remota estiver acessível.

          Mídia:
          - voz, câmera e tela continuam WebRTC P2P;
          - STUN Google configurado;
          - TURN ainda não está configurado e continua sendo uma etapa de confiabilidade futura.

          Observação de teste:
          - esta revisão é a primeira integração ponta a ponta do backend social 0.3.0;
          - recomenda-se testar Guest, Guest → conta, amizade, DM, convite de sala, chamada privada e reconexão em pelo menos dois PCs antes de considerar a migração estável.

          Produto: ESTUDEX v1.9.3
          Revisão técnica: 1.9.26
          Base verificada: v1.9.25-hotfix21
          Backend esperado: ESTUDEX Server 0.3.0 com socialPersistence=parse

          SHA-256 do instalador:
          $env:SETUP_SHA256
          "@
          Set-Content -Path release-notes-hotfix22.txt -Value $notes -Encoding utf8
          gh release create $env:RELEASE_TAG 'dist/ESTUDEX-Setup.exe' 'dist/BLAZERX-Setup.exe' --repo Kodezinho22/BLAZERX-Downloads --target main --title 'ESTUDEX v1.9.3 — Hotfix 22 Cloud Social' --notes-file release-notes-hotfix22.txt --latest
