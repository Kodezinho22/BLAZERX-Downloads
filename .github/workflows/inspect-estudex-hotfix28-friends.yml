name: Inspect ESTUDEX Hotfix 28 Friends

on:
  push:
    branches: [main]
    paths: ['.github/workflows/inspect-estudex-hotfix28-friends.yml']

permissions:
  contents: read

jobs:
  inspect:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Recover Hotfix 27 client and inspect friendship flow
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          gh release download v1.9.31-hotfix27 --repo Kodezinho22/BLAZERX-Downloads --pattern 'ESTUDEX-Setup.exe'
          $hash = (Get-FileHash 'ESTUDEX-Setup.exe' -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "BASE_SETUP_SHA256=$hash"
          New-Item -ItemType Directory -Force -Path setup,nupkg,app | Out-Null
          & 7z x 'ESTUDEX-Setup.exe' '-osetup' -y | Out-Null
          $pkg = Get-ChildItem setup -Recurse -Filter 'blazerx-1.9.31-full.nupkg' | Select-Object -First 1
          if (-not $pkg) { throw 'Hotfix 27 nupkg not found.' }
          & 7z x $pkg.FullName '-onupkg' -y | Out-Null
          $asar = Get-ChildItem nupkg -Recurse -Filter 'app.asar' | Select-Object -First 1
          if (-not $asar) { throw 'Hotfix 27 app.asar not found.' }
          npx --yes @electron/asar extract $asar.FullName app

          $cloud = 'app/public/js/estudex-v193-cloud-social-v1926.js'
          Write-Host '===== CLOUD FRIEND FLOW ====='
          Select-String -Path $cloud -Pattern 'friends/requests|sendFriend|friendRequest|searchUsers|users/search|Adicionar amigo|receiverId|pending' -Context 8,14 | ForEach-Object {
            Write-Host ("--- {0}:{1}" -f $_.Path,$_.LineNumber)
            $_.Context.PreContext | ForEach-Object { Write-Host $_ }
            Write-Host ('>>> ' + $_.Line)
            $_.Context.PostContext | ForEach-Object { Write-Host $_ }
          }

          Write-Host '===== HOME / UI FRIEND FLOW ====='
          Get-ChildItem app/public -Recurse -File -Include *.js,*.html | ForEach-Object {
            Select-String -Path $_.FullName -Pattern 'Adicionar amigo|addFriend|sendFriend|friendRequest|receiverId' -Context 5,10 -ErrorAction SilentlyContinue
          } | ForEach-Object {
            Write-Host ("--- {0}:{1}" -f $_.Path,$_.LineNumber)
            $_.Context.PreContext | ForEach-Object { Write-Host $_ }
            Write-Host ('>>> ' + $_.Line)
            $_.Context.PostContext | ForEach-Object { Write-Host $_ }
          }
