# trigger 3
name: Inspect Hotfix 20 audio path

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/inspect-hotfix20-audio.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Recover Hotfix 20 app
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          gh release download v1.9.24-hotfix20 --repo Kodezinho22/BLAZERX-Downloads --pattern 'ESTUDEX-Setup.exe'
          New-Item -ItemType Directory -Force -Path setup,nupkg,app | Out-Null
          & 7z x 'ESTUDEX-Setup.exe' '-osetup' -y | Out-Null
          $nupkg=Get-ChildItem setup -Recurse -Filter 'blazerx-1.9.24-full.nupkg' | Select-Object -First 1
          if(-not $nupkg){throw 'nupkg missing'}
          & 7z x $nupkg.FullName '-onupkg' -y | Out-Null
          $asar=Get-ChildItem nupkg -Recurse -Filter 'app.asar' | Select-Object -First 1
          if(-not $asar){throw 'asar missing'}
          npx --yes @electron/asar extract $asar.FullName app
      - name: Print audio integration contexts
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $files=@('app/public/estudex-engine.js','app/public/js/home.js','app/public/app.js','app/main.js','app/preload.js','app/package.json')
          $patterns=@('getDisplayMedia','desktopAudio','combinedStream','startShare','audioToggle','audioEnabled','systemAudio','loopback','remote-stream','srcObject','muted','volume','ontrack','addTrack','replaceTrack','getAudioTracks','setDisplayMediaRequestHandler','electron')
          foreach($file in $files){
            if(-not (Test-Path $file)){continue}
            Write-Host "===== FILE $file ====="
            $lines=Get-Content $file
            for($i=0;$i -lt $lines.Count;$i++){
              foreach($p in $patterns){
                if($lines[$i] -match [regex]::Escape($p)){
                  $from=[Math]::Max(0,$i-7); $to=[Math]::Min($lines.Count-1,$i+14)
                  Write-Host "--- $p around line $($i+1) ---"
                  for($j=$from;$j -le $to;$j++){ Write-Host ("{0,6}: {1}" -f ($j+1),$lines[$j]) }
                  break
                }
              }
            }
          }
