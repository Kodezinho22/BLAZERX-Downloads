name: Inspect Hotfix 31 source

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-hotfix31-source.yml'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Recover exact published Hotfix 30 app
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          gh release download v1.9.34-hotfix30 --repo Kodezinho22/BLAZERX-Downloads --pattern 'ESTUDEX-Setup.exe'
          New-Item -ItemType Directory -Force -Path setup,nupkg,app,diagnostics/hotfix31 | Out-Null
          & 7z x 'ESTUDEX-Setup.exe' '-osetup' -y | Out-Null
          $pkg=Get-ChildItem setup -Recurse -Filter 'blazerx-1.9.34-full.nupkg' | Select-Object -First 1
          if(-not $pkg){throw 'Hotfix30 nupkg not found'}
          & 7z x $pkg.FullName '-onupkg' -y | Out-Null
          $asar=Get-ChildItem nupkg -Recurse -Filter app.asar | Select-Object -First 1
          if(-not $asar){throw 'app.asar not found'}
          npx --yes @electron/asar extract $asar.FullName app
          Copy-Item 'app/public/js/estudex-v193-cloud-social-v1926.js' 'diagnostics/hotfix31/cloud-social.js.txt' -Force
          Copy-Item 'app/main.js' 'diagnostics/hotfix31/main.js.txt' -Force
          Copy-Item 'app/preload.js' 'diagnostics/hotfix31/preload.js.txt' -Force
          Get-Content 'app/package.json' -Raw | Set-Content 'diagnostics/hotfix31/package.json.txt' -Encoding utf8
      - name: Commit diagnostics snapshot
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add diagnostics/hotfix31
          if(git diff --cached --quiet){ Write-Host 'No changes'; exit 0 }
          git commit -m 'chore: snapshot Hotfix30 source for Hotfix31 [skip ci]'
          git push
