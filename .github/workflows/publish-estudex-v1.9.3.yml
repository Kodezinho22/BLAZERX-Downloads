name: Publish ESTUDEX v1.9.3

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-estudex-v1.9.3.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ARTIFACT_URL: "https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-e74c-820e-8ccb-05e140aeee95/raw?se=2026-08-29T04%3A48%3A50Z&sp=r&sv=2026-02-06&sr=b&scid=2ce81c8c-132a-5df0-ae50-ceee9cbce80a&skoid=127c13cb-e695-43ea-b6b2-0a863d41dbf7&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-28T20%3A26%3A54Z&ske=2026-08-29T20%3A26%3A54Z&sks=b&skv=2026-02-06&sig=/zdc1O0M7KsRmVu08759pHlBsb2IEySS87gzdt/IKZE%3D"
      ARTIFACT_SHA256: b4d4de936e1fb71ab9f8a11c4d9a1eeae571fef62468b31620fd21ab585152e5
      SETUP_SHA256: 333f8201e2f521401bd49fa694a1c3bf743109d6851ef727633367b93e426497

    steps:
      - uses: actions/checkout@v4

      - name: Download and verify Build #5
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 "$ARTIFACT_URL" -o artifact.zip
          echo "$ARTIFACT_SHA256  artifact.zip" | sha256sum -c -
          mkdir artifact
          unzip -q artifact.zip -d artifact
          setup="$(find artifact -type f -name 'ESTUDEX-Setup.exe' -print -quit)"
          test -n "$setup"
          echo "$SETUP_SHA256  $setup" | sha256sum -c -
          cp "$setup" ESTUDEX-Setup.exe

      - name: Publish GitHub Release v1.9.3
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          notes=$(cat <<'EOF'
          ESTUDEX v1.9.3 — V10.10 Exact

          Versão validada em runtime com a interface V10.10 preservada e os motores ESTUDEX integrados.

          Destaques:
          - tema personalizado aplicado de forma consistente na interface;
          - perfil, status e contador de amigos estabilizados;
          - chat de sala com mídia estabilizada;
          - chamadas diretas por DM e integração Radmin;
          - hotbar da transmissão ajustada e botão inativo removido;
          - identidade visual e ícone oficial do ESTUDEX preservados.

          SHA-256 do ESTUDEX-Setup.exe:
          333f8201e2f521401bd49fa694a1c3bf743109d6851ef727633367b93e426497
          EOF
          )
          if gh release view v1.9.3 >/dev/null 2>&1; then
            gh release upload v1.9.3 ESTUDEX-Setup.exe --clobber
            gh release edit v1.9.3 --title "ESTUDEX v1.9.3 — V10.10 Exact" --notes "$notes"
          else
            gh release create v1.9.3 ESTUDEX-Setup.exe --target main --title "ESTUDEX v1.9.3 — V10.10 Exact" --notes "$notes"
          fi
