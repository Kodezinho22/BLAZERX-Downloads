name: Inspect ESTUDEX Hotfix 29 Network Social Rooms

on:
  push:
    branches: [main]
    paths: ['.github/workflows/inspect-estudex-hotfix29-network.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Recover Hotfix 28 client
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          gh release download v1.9.32-hotfix28 --repo Kodezinho22/BLAZERX-Downloads --pattern 'ESTUDEX-Setup.exe'
          New-Item -ItemType Directory -Force -Path setup,nupkg,app,inspection | Out-Null
          & 7z x 'ESTUDEX-Setup.exe' '-osetup' -y | Out-Null
          $pkg = Get-ChildItem setup -Recurse -Filter 'blazerx-1.9.32-full.nupkg' | Select-Object -First 1
          if (-not $pkg) { throw 'Hotfix 28 nupkg not found.' }
          & 7z x $pkg.FullName '-onupkg' -y | Out-Null
          $asar = Get-ChildItem nupkg -Recurse -Filter 'app.asar' | Select-Object -First 1
          if (-not $asar) { throw 'Hotfix 28 app.asar not found.' }
          npx --yes @electron/asar extract $asar.FullName app
          Copy-Item app/package.json inspection/package.json
          Copy-Item app/forge.config.js inspection/forge.config.js
          if (Test-Path app/estudex-hotfix28-manifest.json) { Copy-Item app/estudex-hotfix28-manifest.json inspection/estudex-hotfix28-manifest.json }
          New-Item -ItemType Directory -Force -Path inspection/public | Out-Null
          Copy-Item app/public/* inspection/public/ -Recurse
      - name: Upload recovered Hotfix 28 source
        uses: actions/upload-artifact@v4
        with:
          name: estudex-hotfix28-recovered-source
          path: inspection
          retention-days: 2
          if-no-files-found: error
