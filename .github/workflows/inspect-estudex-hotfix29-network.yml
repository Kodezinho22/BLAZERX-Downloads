name: Inspect ESTUDEX Hotfix 29 Network Social Rooms

on:
  push:
    branches: [main]
    paths: ['.github/workflows/inspect-estudex-hotfix29-network.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Recover Hotfix 28 client and inspect live network flows
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          gh release download v1.9.32-hotfix28 --repo Kodezinho22/BLAZERX-Downloads --pattern 'ESTUDEX-Setup.exe'
          New-Item -ItemType Directory -Force -Path setup,nupkg,app | Out-Null
          & 7z x 'ESTUDEX-Setup.exe' '-osetup' -y | Out-Null
          $pkg = Get-ChildItem setup -Recurse -Filter 'blazerx-1.9.32-full.nupkg' | Select-Object -First 1
          if (-not $pkg) { throw 'Hotfix 28 nupkg not found.' }
          & 7z x $pkg.FullName '-onupkg' -y | Out-Null
          $asar = Get-ChildItem nupkg -Recurse -Filter 'app.asar' | Select-Object -First 1
          if (-not $asar) { throw 'Hotfix 28 app.asar not found.' }
          npx --yes @electron/asar extract $asar.FullName app

          function Dump-Matches($title, $patterns) {
            Write-Host "===== $title ====="
            Get-ChildItem app/public -Recurse -File -Include *.js,*.html | ForEach-Object {
              Select-String -Path $_.FullName -Pattern $patterns -Context 12,20 -ErrorAction SilentlyContinue
            } | Select-Object -First 160 | ForEach-Object {
              Write-Host ("--- {0}:{1}" -f $_.Path,$_.LineNumber)
              $_.Context.PreContext | ForEach-Object { Write-Host $_ }
              Write-Host ('>>> ' + $_.Line)
              $_.Context.PostContext | ForEach-Object { Write-Host $_ }
            }
          }

          Dump-Matches 'PEOPLE SEARCH / ABORT / FRIEND REQUEST' @(
            'AbortController','aborted a request','AbortError','users/search','searchUsers','friends/requests','receiverId','addFriendResults','data-invite-detected','debounce'
          )

          Dump-Matches 'ROOM JOIN / TIMEOUT / SOCKET' @(
            'Tempo esgotado ao entrar na sala','entrar na sala','join-room','joinRoom','room:join','socket.emit','socket.on','connect_error','disconnect','reconnect','room-code','roomCode'
          )

          Dump-Matches 'STREAM NEGOTIATION / P2P' @(
            'Conectando à tela','RTCPeerConnection','createOffer','createAnswer','icecandidate','addIceCandidate','track','peer','watch','viewer','host','screen-share','screenShare'
          )

          Dump-Matches 'SAVED ROOMS / ONLINE OFFLINE STATUS' @(
            'Salas salvas','savedRooms','saved rooms','Offline','offline','online','roomStatus','liveRooms','recentRooms','room-state','roomState'
          )
