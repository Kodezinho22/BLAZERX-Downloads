name: Inspect Hotfix 30 exact auth source

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-hotfix30-source.yml'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Recover exact published Hotfix 29 app
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          gh release download v1.9.33-hotfix29 --repo Kodezinho22/BLAZERX-Downloads --pattern 'ESTUDEX-Setup.exe'
          New-Item -ItemType Directory -Force -Path setup,nupkg,app,diagnostics/hotfix30 | Out-Null
          & 7z x 'ESTUDEX-Setup.exe' '-osetup' -y | Out-Null
          $pkg=Get-ChildItem setup -Recurse -Filter 'blazerx-1.9.33-full.nupkg' | Select-Object -First 1
          if(-not $pkg){throw 'Hotfix29 nupkg not found'}
          & 7z x $pkg.FullName '-onupkg' -y | Out-Null
          $asar=Get-ChildItem nupkg -Recurse -Filter app.asar | Select-Object -First 1
          if(-not $asar){throw 'app.asar not found'}
          npx --yes @electron/asar extract $asar.FullName app
          Copy-Item 'app/public/js/estudex-v193-cloud-social-v1926.js' 'diagnostics/hotfix30/cloud-social.js.txt' -Force
          $patterns='Failed to fetch|create account|Criar conta|register\(|guest\(|authError|login\(|resolveBase|serverBase|backend|b4a\.run|code\.run'
          Get-ChildItem 'app/public' -Recurse -File -Include *.js,*.html | Select-String -Pattern $patterns -CaseSensitive:$false | ForEach-Object { "{0}:{1}: {2}" -f $_.Path.Replace((Resolve-Path app).Path+'\\',''),$_.LineNumber,$_.Line.Trim() } | Set-Content 'diagnostics/hotfix30/auth-ui-matches.txt' -Encoding utf8
      - name: Commit diagnostics snapshot
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add diagnostics/hotfix30/cloud-social.js.txt diagnostics/hotfix30/auth-ui-matches.txt
          if(git diff --cached --quiet){ Write-Host 'No changes'; exit 0 }
          git commit -m 'chore: snapshot Hotfix29 auth source for Hotfix30 [skip ci]'
          git push
