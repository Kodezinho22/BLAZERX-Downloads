name: Inspect ESTUDEX Hotfix 14 source

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/inspect-estudex-hotfix14-source.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Download published Hotfix 14 installer
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download v1.9.18-hotfix14 --repo Kodezinho22/BLAZERX-Downloads --pattern 'ESTUDEX-Setup.exe'
          echo 'e2a4bc7a52834c0b26fa8f82792b91b758b91323a064a704a4f5f690db2d22e5  ESTUDEX-Setup.exe' | sha256sum -c -

      - name: Inspect and extract Squirrel installer
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p inspect setup-extracted
          7z l ESTUDEX-Setup.exe > inspect/setup-list.txt 2>&1 || true
          7z x ESTUDEX-Setup.exe -osetup-extracted -y > inspect/setup-extract.log 2>&1 || true
          find setup-extracted -type f | sort > inspect/setup-extracted-files.txt

          nupkg="$(find setup-extracted -type f -name '*.nupkg' -print -quit)"
          if [ -z "$nupkg" ]; then
            echo 'No nupkg extracted directly from Setup.exe.' > inspect/paths.txt
            exit 0
          fi

          echo "nupkg=$nupkg" > inspect/paths.txt
          mkdir package
          unzip -q "$nupkg" -d package
          find package -maxdepth 8 -type f | sort > inspect/nupkg-files.txt
          if [ -f package/blazerx.nuspec ]; then cp package/blazerx.nuspec inspect/blazerx.nuspec; fi
          asar="$(find package -type f -name 'app.asar' -print -quit)"
          if [ -z "$asar" ]; then
            echo 'No app.asar inside extracted nupkg.' >> inspect/paths.txt
            exit 0
          fi

          echo "asar=$asar" >> inspect/paths.txt
          npx --yes @electron/asar extract "$asar" extracted-app
          find extracted-app -maxdepth 5 -type f | sort > inspect/app-files.txt

          for src in \
            package.json forge.config.js server.js main.js preload.js \
            public/index.html public/estudex-engine.js \
            public/js/home.js public/css/home.css \
            public/js/estudex-v193-hotfix14-connectivity-media-room.js \
            public/js/estudex-v193-spec-radmin.js; do
            if [ -f "extracted-app/$src" ]; then
              dest="$(echo "$src" | tr '/' '_')"
              cp "extracted-app/$src" "inspect/$dest"
            fi
          done

          grep -RIl --exclude='*.map' -E 'lan-peers|direct-identify|ESTUDEX|radmin|Radmin' extracted-app 2>/dev/null | head -n 100 > inspect/relevant-files.txt || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: estudex-hotfix14-source-inspection
          path: inspect
          retention-days: 1
          if-no-files-found: error
