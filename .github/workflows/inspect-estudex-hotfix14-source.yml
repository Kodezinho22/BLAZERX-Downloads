name: Inspect ESTUDEX Hotfix 14 source

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/inspect-estudex-hotfix14-source.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ARTIFACT_URL: "https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-f004-820e-98dd-4a7ff81b805e/raw?se=2026-09-13T23%3A08%3A44Z&sp=r&sv=2026-02-06&sr=b&scid=b77b6fd2-a00d-5e8c-9ff6-2f80f11400f1&skoid=4a431cd2-eafd-49c7-90be-bbb4d45e696d&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-13T11%3A16%3A42Z&ske=2026-09-14T11%3A16%3A42Z&sks=b&skv=2026-02-06&sig=zJC4fxF142YtNqnywUIWdt42knTXeyw5mnmIuAM2%2B1c%3D"
      ARTIFACT_SHA256: 9679bfa5e1d5888218f737ad36dc6c9fc64eba82b0a084456e54f250fe483cd0

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Download verified Hotfix 14 artifact
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 "$ARTIFACT_URL" -o artifact.zip
          echo "$ARTIFACT_SHA256  artifact.zip" | sha256sum -c -
          mkdir artifact
          unzip -q artifact.zip -d artifact
          nupkg="$(find artifact -type f -name 'blazerx-1.9.18-full.nupkg' -print -quit)"
          test -n "$nupkg"
          echo "NUPKG=$nupkg" >> "$GITHUB_ENV"

      - name: Extract packaged application source
        shell: bash
        run: |
          set -euo pipefail
          mkdir package
          unzip -q "$NUPKG" -d package
          asar="$(find package -type f -name 'app.asar' -print -quit)"
          test -n "$asar"
          npx --yes @electron/asar extract "$asar" extracted-app
          mkdir inspect
          cp extracted-app/package.json inspect/package.json
          cp extracted-app/server.js inspect/server.js
          cp extracted-app/main.js inspect/main.js
          cp extracted-app/preload.js inspect/preload.js
          cp extracted-app/public/app.js inspect/app.js
          cp extracted-app/public/index.html inspect/index.html
          if [ -f extracted-app/public/home.js ]; then cp extracted-app/public/home.js inspect/home.js; fi
          if [ -f extracted-app/public/home.css ]; then cp extracted-app/public/home.css inspect/home.css; fi
          find package -maxdepth 4 -type f | sort > inspect/nupkg-files.txt
          printf 'nupkg=%s\nasar=%s\n' "$NUPKG" "$asar" > inspect/paths.txt

      - uses: actions/upload-artifact@v4
        with:
          name: estudex-hotfix14-source-inspection
          path: inspect
          retention-days: 1
          if-no-files-found: error
