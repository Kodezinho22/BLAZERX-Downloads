name: Inspect ESTUDEX Hotfix 14 source

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/inspect-estudex-hotfix14-source.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Download published Hotfix 14 installer
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download v1.9.18-hotfix14 --repo Kodezinho22/BLAZERX-Downloads --pattern 'ESTUDEX-Setup.exe'
          echo 'e2a4bc7a52834c0b26fa8f82792b91b758b91323a064a704a4f5f690db2d22e5  ESTUDEX-Setup.exe' | sha256sum -c -

      - name: Inspect and extract Squirrel installer
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p inspect setup-extracted
          7z l ESTUDEX-Setup.exe > inspect/setup-list.txt 2>&1 || true
          7z x ESTUDEX-Setup.exe -osetup-extracted -y > inspect/setup-extract.log 2>&1 || true
          find setup-extracted -type f | sort > inspect/setup-extracted-files.txt

          nupkg="$(find setup-extracted -type f -name '*.nupkg' -print -quit)"
          if [ -n "$nupkg" ]; then
            echo "nupkg=$nupkg" > inspect/paths.txt
            mkdir package
            unzip -q "$nupkg" -d package
            find package -maxdepth 6 -type f | sort > inspect/nupkg-files.txt
            asar="$(find package -type f -name 'app.asar' -print -quit)"
            if [ -n "$asar" ]; then
              echo "asar=$asar" >> inspect/paths.txt
              npx --yes @electron/asar extract "$asar" extracted-app
              cp extracted-app/package.json inspect/package.json
              cp extracted-app/server.js inspect/server.js
              cp extracted-app/main.js inspect/main.js
              cp extracted-app/preload.js inspect/preload.js
              cp extracted-app/public/app.js inspect/app.js
              cp extracted-app/public/index.html inspect/index.html
              if [ -f extracted-app/public/home.js ]; then cp extracted-app/public/home.js inspect/home.js; fi
              if [ -f extracted-app/public/home.css ]; then cp extracted-app/public/home.css inspect/home.css; fi
            fi
          else
            echo 'No nupkg extracted directly from Setup.exe.' > inspect/paths.txt
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: estudex-hotfix14-source-inspection
          path: inspect
          retention-days: 1
          if-no-files-found: error
