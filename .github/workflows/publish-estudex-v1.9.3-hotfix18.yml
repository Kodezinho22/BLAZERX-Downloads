name: Publish ESTUDEX v1.9.3 Hotfix 18

on:
  push:
    branches: [main]
    paths:
      - hotfixes/v1.9.22-hotfix18/**
      - .github/workflows/publish-estudex-v1.9.3-hotfix18.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-publish:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      BASE_TAG: v1.9.21-hotfix17
      RELEASE_TAG: v1.9.22-hotfix18
      BASE_SETUP_SHA256: 9075ab366ad9562a0a352ca573d2a908cb5b83427db5b530de5a9d518feed12c

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Download and verify Hotfix 17 baseline
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          gh release download $env:BASE_TAG --repo Kodezinho22/BLAZERX-Downloads --pattern 'ESTUDEX-Setup.exe'
          $hash = (Get-FileHash 'ESTUDEX-Setup.exe' -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne $env:BASE_SETUP_SHA256) { throw "Hotfix 17 baseline SHA mismatch: $hash" }

      - name: Recover exact Hotfix 17 application source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path base-setup,base-nupkg,app | Out-Null
          & 7z x 'ESTUDEX-Setup.exe' '-obase-setup' -y | Out-Null
          $nupkg = Get-ChildItem base-setup -Recurse -Filter 'blazerx-1.9.21-full.nupkg' | Select-Object -First 1
          if (-not $nupkg) { throw 'Hotfix 17 nupkg not found inside published installer.' }
          & 7z x $nupkg.FullName '-obase-nupkg' -y | Out-Null
          $asar = Get-ChildItem base-nupkg -Recurse -Filter 'app.asar' | Select-Object -First 1
          if (-not $asar) { throw 'Hotfix 17 app.asar not found.' }
          npx --yes @electron/asar extract $asar.FullName app
          foreach ($required in @('server.js','public/estudex-engine.js','public/js/home.js','public/css/home.css')) {
            if (-not (Test-Path (Join-Path 'app' $required))) { throw "Recovered app missing $required" }
          }
          node hotfixes/v1.9.21-hotfix17/contract.cjs app
          $baseHomeJs = (Get-FileHash 'app/public/js/home.js' -Algorithm SHA256).Hash.ToLowerInvariant()
          $baseHomeCss = (Get-FileHash 'app/public/css/home.css' -Algorithm SHA256).Hash.ToLowerInvariant()
          "BASE_HOME_JS=$baseHomeJs" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "BASE_HOME_CSS=$baseHomeCss" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Apply Hotfix 18 Minecraft-style Radmin LAN restore
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          node hotfixes/v1.9.22-hotfix18/patch.cjs app
          node --check app/server.js
          node --check app/public/estudex-engine.js
          node --check app/main.js
          node --check app/preload.js
          node hotfixes/v1.9.22-hotfix18/contract.cjs app
          $homeJs = (Get-FileHash 'app/public/js/home.js' -Algorithm SHA256).Hash.ToLowerInvariant()
          $homeCss = (Get-FileHash 'app/public/css/home.css' -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($homeJs -ne $env:BASE_HOME_JS) { throw 'Canonical V10.10 home.js changed.' }
          if ($homeCss -ne $env:BASE_HOME_CSS) { throw 'Canonical V10.10 home.css changed.' }

      - name: Install build dependencies
        shell: pwsh
        working-directory: app
        run: |
          $ErrorActionPreference = 'Stop'
          if (Test-Path node_modules) { Remove-Item node_modules -Recurse -Force }
          npm install --no-audit --no-fund

      - name: Build ESTUDEX technical revision 1.9.22
        shell: pwsh
        working-directory: app
        run: |
          $ErrorActionPreference = 'Stop'
          npx electron-forge make --platform=win32 --arch=x64

      - name: Verify final package and canonical V10.10 UI
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path dist,verify-nupkg,verify-app | Out-Null
          $setup = Get-ChildItem 'app/out/make' -Recurse -Filter 'ESTUDEX-Setup.exe' | Select-Object -First 1
          $nupkg = Get-ChildItem 'app/out/make' -Recurse -Filter 'blazerx-1.9.22-full.nupkg' | Select-Object -First 1
          if (-not $setup) { throw 'ESTUDEX-Setup.exe was not generated.' }
          if (-not $nupkg) { throw 'blazerx-1.9.22-full.nupkg was not generated.' }
          Copy-Item $setup.FullName 'dist/ESTUDEX-Setup.exe' -Force
          Copy-Item $setup.FullName 'dist/BLAZERX-Setup.exe' -Force
          Copy-Item $nupkg.FullName 'dist/blazerx-1.9.22-full.nupkg' -Force
          & 7z x $nupkg.FullName '-overify-nupkg' -y | Out-Null
          $asar = Get-ChildItem verify-nupkg -Recurse -Filter 'app.asar' | Select-Object -First 1
          if (-not $asar) { throw 'Final app.asar missing from nupkg.' }
          npx --yes @electron/asar extract $asar.FullName verify-app
          node hotfixes/v1.9.22-hotfix18/contract.cjs verify-app
          $homeJs = (Get-FileHash 'verify-app/public/js/home.js' -Algorithm SHA256).Hash.ToLowerInvariant()
          $homeCss = (Get-FileHash 'verify-app/public/css/home.css' -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($homeJs -ne $env:BASE_HOME_JS) { throw 'Packaged V10.10 home.js changed.' }
          if ($homeCss -ne $env:BASE_HOME_CSS) { throw 'Packaged V10.10 home.css changed.' }
          $nuspec = Get-ChildItem verify-nupkg -Recurse -Filter 'blazerx.nuspec' | Select-Object -First 1
          if (-not $nuspec) { throw 'Final blazerx.nuspec missing.' }
          $nuspecText = Get-Content $nuspec.FullName -Raw
          if ($nuspecText -notmatch '<version>1\.9\.22</version>') { throw 'Final Squirrel package version is not 1.9.22.' }
          $setupHash = (Get-FileHash 'dist/ESTUDEX-Setup.exe' -Algorithm SHA256).Hash.ToLowerInvariant()
          "SETUP_SHA256=$setupHash" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "ESTUDEX Hotfix 18 installer SHA-256: $setupHash"

      - uses: actions/upload-artifact@v4
        with:
          name: ESTUDEX-v1.9.3-Hotfix18
          path: |
            dist/ESTUDEX-Setup.exe
            dist/BLAZERX-Setup.exe
            dist/blazerx-1.9.22-full.nupkg
          retention-days: 14
          if-no-files-found: error

      - name: Publish ESTUDEX v1.9.3 Hotfix 18
        if: ${{ github.ref == 'refs/heads/main' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          gh release view $env:RELEASE_TAG --repo Kodezinho22/BLAZERX-Downloads *> $null
          if ($LASTEXITCODE -eq 0) { throw "Release $env:RELEASE_TAG already exists; refusing to overwrite a versioned update." }
          $notes = @"
          ESTUDEX v1.9.3 — Hotfix 18

          Revisão técnica 1.9.22, construída diretamente sobre o Hotfix 17 publicado e verificado.

          Restauração do discovery Radmin no modelo original tipo Minecraft:
          - o Radmin volta a ser tratado somente como uma interface LAN virtual 26.x, como o Minecraft trata uma rede local;
          - o caminho principal de descoberta volta a usar diretamente os beacons UDP próprios do ESTUDEX (V172), enviados/recebidos pela interface Radmin;
          - remove do caminho normal a dependência de UI Automation, phonebook do Radmin, registro, netstat e scanners de membros;
          - um beacon fresco do ESTUDEX significa que o ESTUDEX remoto está realmente aberto; estar Online no Radmin sozinho não promove ninguém a Online no ESTUDEX;
          - remove do caminho principal o filtro V187 que podia excluir e apagar um peer LAN válido após uma falha/timeout temporário de direct-identify;
          - atualização manual/profunda mantém somente um fallback secundário compatível com o mecanismo antigo: browse UDP ESTUDEX + direct-identify de vizinhos;
          - usuários conhecidos podem permanecer visíveis como Offline por até 60 s, mas Online só vem de presença ESTUDEX fresca;
          - preserva as correções do Hotfix 17 que impedem a interface de forçar online:true e causar flapping visual.

          Arquitetura esperada:
          Radmin VPN -> interface virtual 26.x -> broadcast/multicast UDP do ESTUDEX -> peers ESTUDEX.
          Nenhuma leitura da lista visual de membros do Radmin é necessária para a descoberta normal.

          Preservação cumulativa:
          - mantém Hotfixes 1–17 e os demais reparos de amizade, salas, updater, voz, transmissão, WebRTC e estabilidade;
          - V10.10 continua autoridade visual absoluta;
          - public/js/home.js e public/css/home.css preservados byte por byte;
          - identidade Squirrel/updater continua blazerx.

          Produto: ESTUDEX v1.9.3
          Revisão técnica: 1.9.22
          Base verificada: v1.9.21-hotfix17

          SHA-256 do instalador:
          $env:SETUP_SHA256
          "@
          Set-Content -Path release-notes-hotfix18.txt -Value $notes -Encoding utf8
          gh release create $env:RELEASE_TAG 'dist/ESTUDEX-Setup.exe' 'dist/BLAZERX-Setup.exe' --repo Kodezinho22/BLAZERX-Downloads --target main --title 'ESTUDEX v1.9.3 — Hotfix 18' --notes-file release-notes-hotfix18.txt --latest
