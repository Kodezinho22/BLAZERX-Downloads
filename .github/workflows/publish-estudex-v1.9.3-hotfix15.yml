name: Publish ESTUDEX v1.9.3 Hotfix 15

on:
  push:
    branches: [main]
    paths:
      - hotfixes/v1.9.19-hotfix15/**
      - .github/workflows/publish-estudex-v1.9.3-hotfix15.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-publish:
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      BASE_TAG: v1.9.18-hotfix14
      RELEASE_TAG: v1.9.19-hotfix15
      BASE_SETUP_SHA256: e2a4bc7a52834c0b26fa8f82792b91b758b91323a064a704a4f5f690db2d22e5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Download and verify Hotfix 14 baseline
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          gh release download $env:BASE_TAG --repo Kodezinho22/BLAZERX-Downloads --pattern 'ESTUDEX-Setup.exe'
          $hash = (Get-FileHash 'ESTUDEX-Setup.exe' -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne $env:BASE_SETUP_SHA256) { throw "Hotfix 14 baseline SHA mismatch: $hash" }

      - name: Recover exact Hotfix 14 application source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path base-setup,base-nupkg,app | Out-Null
          & 7z x 'ESTUDEX-Setup.exe' '-obase-setup' -y | Out-Null
          $nupkg = Get-ChildItem base-setup -Recurse -Filter 'blazerx-1.9.18-full.nupkg' | Select-Object -First 1
          if (-not $nupkg) { throw 'Hotfix 14 nupkg not found inside published installer.' }
          & 7z x $nupkg.FullName '-obase-nupkg' -y | Out-Null
          $asar = Get-ChildItem base-nupkg -Recurse -Filter 'app.asar' | Select-Object -First 1
          if (-not $asar) { throw 'Hotfix 14 app.asar not found.' }
          npx --yes @electron/asar extract $asar.FullName app
          if (-not (Test-Path 'app/server.js')) { throw 'Recovered app is missing server.js.' }
          if (-not (Test-Path 'app/public/estudex-engine.js')) { throw 'Recovered app is missing ESTUDEX engine.' }
          if (-not (Test-Path 'app/public/js/home.js')) { throw 'Canonical V10.10 home.js missing.' }
          if (-not (Test-Path 'app/public/css/home.css')) { throw 'Canonical V10.10 home.css missing.' }
          $baseHomeJs = (Get-FileHash 'app/public/js/home.js' -Algorithm SHA256).Hash.ToLowerInvariant()
          $baseHomeCss = (Get-FileHash 'app/public/css/home.css' -Algorithm SHA256).Hash.ToLowerInvariant()
          "BASE_HOME_JS=$baseHomeJs" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "BASE_HOME_CSS=$baseHomeCss" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Apply Hotfix 15 presence repair
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          node hotfixes/v1.9.19-hotfix15/patch.cjs app
          node --check app/server.js
          node --check app/public/estudex-engine.js
          node --check app/main.js
          node --check app/preload.js
          node hotfixes/v1.9.19-hotfix15/contract.cjs app
          $homeJs = (Get-FileHash 'app/public/js/home.js' -Algorithm SHA256).Hash.ToLowerInvariant()
          $homeCss = (Get-FileHash 'app/public/css/home.css' -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($homeJs -ne $env:BASE_HOME_JS) { throw 'Canonical V10.10 home.js changed.' }
          if ($homeCss -ne $env:BASE_HOME_CSS) { throw 'Canonical V10.10 home.css changed.' }

      - name: Install deterministic build dependencies
        shell: pwsh
        working-directory: app
        run: |
          $ErrorActionPreference = 'Stop'
          if (Test-Path node_modules) { Remove-Item node_modules -Recurse -Force }
          npm install --no-audit --no-fund

      - name: Build ESTUDEX technical revision 1.9.19
        shell: pwsh
        working-directory: app
        run: |
          $ErrorActionPreference = 'Stop'
          npx electron-forge make --platform=win32 --arch=x64

      - name: Verify final Squirrel package and canonical V10.10 UI
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path dist,verify-nupkg,verify-app | Out-Null
          $setup = Get-ChildItem 'app/out/make' -Recurse -Filter 'ESTUDEX-Setup.exe' | Select-Object -First 1
          $nupkg = Get-ChildItem 'app/out/make' -Recurse -Filter 'blazerx-1.9.19-full.nupkg' | Select-Object -First 1
          if (-not $setup) { throw 'ESTUDEX-Setup.exe was not generated.' }
          if (-not $nupkg) { throw 'blazerx-1.9.19-full.nupkg was not generated.' }
          Copy-Item $setup.FullName 'dist/ESTUDEX-Setup.exe' -Force
          Copy-Item $setup.FullName 'dist/BLAZERX-Setup.exe' -Force
          Copy-Item $nupkg.FullName 'dist/blazerx-1.9.19-full.nupkg' -Force
          & 7z x $nupkg.FullName '-overify-nupkg' -y | Out-Null
          $asar = Get-ChildItem verify-nupkg -Recurse -Filter 'app.asar' | Select-Object -First 1
          if (-not $asar) { throw 'Final app.asar missing from nupkg.' }
          npx --yes @electron/asar extract $asar.FullName verify-app
          node hotfixes/v1.9.19-hotfix15/contract.cjs verify-app
          $homeJs = (Get-FileHash 'verify-app/public/js/home.js' -Algorithm SHA256).Hash.ToLowerInvariant()
          $homeCss = (Get-FileHash 'verify-app/public/css/home.css' -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($homeJs -ne $env:BASE_HOME_JS) { throw 'Packaged V10.10 home.js changed.' }
          if ($homeCss -ne $env:BASE_HOME_CSS) { throw 'Packaged V10.10 home.css changed.' }
          $nuspec = Get-ChildItem verify-nupkg -Recurse -Filter 'blazerx.nuspec' | Select-Object -First 1
          if (-not $nuspec) { throw 'Final blazerx.nuspec missing.' }
          $nuspecText = Get-Content $nuspec.FullName -Raw
          if ($nuspecText -notmatch '<version>1\.9\.19</version>') { throw 'Final Squirrel package version is not 1.9.19.' }
          $setupHash = (Get-FileHash 'dist/ESTUDEX-Setup.exe' -Algorithm SHA256).Hash.ToLowerInvariant()
          "SETUP_SHA256=$setupHash" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "ESTUDEX Hotfix 15 installer SHA-256: $setupHash"

      - uses: actions/upload-artifact@v4
        with:
          name: ESTUDEX-v1.9.3-Hotfix15
          path: |
            dist/ESTUDEX-Setup.exe
            dist/BLAZERX-Setup.exe
            dist/blazerx-1.9.19-full.nupkg
          retention-days: 14
          if-no-files-found: error

      - name: Publish ESTUDEX v1.9.3 Hotfix 15
        if: ${{ github.ref == 'refs/heads/main' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          gh release view $env:RELEASE_TAG --repo Kodezinho22/BLAZERX-Downloads *> $null
          if ($LASTEXITCODE -eq 0) { throw "Release $env:RELEASE_TAG already exists; refusing to overwrite a versioned update." }
          $notes = @"
          ESTUDEX v1.9.3 — Hotfix 15

          Atualização cumulativa real com revisão técnica 1.9.19, construída diretamente sobre o pacote publicado e verificado do Hotfix 14.

          Presença Online/Offline corrigida:
          - Radmin volta a ser somente o transporte da rede; estar verde no Radmin, sozinho, nunca significa estar Online no ESTUDEX;
          - um usuário só entra como Online após prova de um ESTUDEX ativo via /api/social/direct-identify na porta TCP 8787;
          - mantém o beacon UDP rápido, mas agora combina automaticamente com tabela de vizinhos/ARP + identificação direta quando UDP/multicast não chega;
          - corrige o caso em que o ESTUDEX remoto está aberto e acessível pela 8787, mas some ou alterna Online/Offline por falha do beacon;
          - se o Radmin continuar aberto e o ESTUDEX remoto for fechado, a prova direta deixa de responder e o usuário passa a Offline após a tolerância curta de presença;
          - reduz o cache de verificação de identidade de 12 s para 4 s e a tolerância visual automática de 14 s para 9 s, evitando tanto piscadas quanto presença verde presa por muito tempo;
          - atualização forçada continua sem usar a tolerância visual antiga: mostra apenas peers comprovados naquele refresh.

          Preservação cumulativa:
          - mantém integralmente Hotfixes 1–14, incluindo amizade, salas, updater, voz, transmissão, WebRTC e estabilidade;
          - a V10.10 original permanece autoridade visual absoluta;
          - public/js/home.js e public/css/home.css foram preservados byte por byte em relação ao Hotfix 14;
          - identidade Squirrel/updater permanece blazerx para atualização no lugar.

          Produto: ESTUDEX v1.9.3
          Revisão técnica do pacote/updater: 1.9.19
          Base verificada: v1.9.18-hotfix14

          SHA-256 do instalador:
          $env:SETUP_SHA256
          "@
          Set-Content -Path release-notes-hotfix15.txt -Value $notes -Encoding utf8
          gh release create $env:RELEASE_TAG 'dist/ESTUDEX-Setup.exe' 'dist/BLAZERX-Setup.exe' --repo Kodezinho22/BLAZERX-Downloads --target main --title 'ESTUDEX v1.9.3 — Hotfix 15' --notes-file release-notes-hotfix15.txt --latest
