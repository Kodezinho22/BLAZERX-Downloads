name: Inspect ESTUDEX Hotfix 25 Runtime

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-hotfix25-runtime.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Recover Hotfix 25 app source
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          gh release download v1.9.29-hotfix25 --repo Kodezinho22/BLAZERX-Downloads --pattern 'ESTUDEX-Setup.exe'
          New-Item -ItemType Directory -Force -Path setup,nupkg,app | Out-Null
          & 7z x 'ESTUDEX-Setup.exe' '-osetup' -y | Out-Null
          $pkg = Get-ChildItem setup -Recurse -Filter 'blazerx-1.9.29-full.nupkg' | Select-Object -First 1
          if (-not $pkg) { throw 'H25 nupkg missing' }
          & 7z x $pkg.FullName '-onupkg' -y | Out-Null
          $asar = Get-ChildItem nupkg -Recurse -Filter 'app.asar' | Select-Object -First 1
          if (-not $asar) { throw 'H25 app.asar missing' }
          npx --yes @electron/asar extract $asar.FullName app
      - name: Inspect final Hotfix 26 anchors
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Slice($file,$start,$end){
            Write-Host "===== FILE $file L$start-L$end ====="
            $lines=Get-Content $file
            for($i=$start;$i -le [Math]::Min($end,$lines.Count);$i++){ Write-Host ("{0:D4}: {1}" -f $i,$lines[$i-1]) }
          }
          Slice 'app/public/js/estudex-engine-socket-compat.js' 355 560
          Slice 'app/public/js/estudex-v193-cloud-social-v1926.js' 120 245
          Slice 'app/public/index.html' 500 630
          $idx=Get-Content 'app/public/index.html'; $start=[Math]::Max(1,$idx.Count-110); Slice 'app/public/index.html' $start $idx.Count
          Write-Host '===== MODAL-LAYER IDs AND CLOSE BUTTONS ====='
          Get-ChildItem app/public -Recurse -File | Where-Object {$_.Extension -in '.html','.js'} | Select-String -Pattern 'modal-layer|closeAddFriendModal|closeGuestUpgradeModal|close.*Modal' -CaseSensitive:$false -Context 1,2 | Select-Object -First 100 | ForEach-Object { Write-Host ("--- {0}:{1}`n{2}`n>>> {3}`n{4}" -f $_.Path,$_.LineNumber,($_.Context.PreContext -join "`n"),$_.Line,($_.Context.PostContext -join "`n")) }
