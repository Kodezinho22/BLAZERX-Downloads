name: Inspect ESTUDEX Hotfix 25 Runtime

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-hotfix25-runtime.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Recover Hotfix 25 app source
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          gh release download v1.9.29-hotfix25 --repo Kodezinho22/BLAZERX-Downloads --pattern 'ESTUDEX-Setup.exe'
          New-Item -ItemType Directory -Force -Path setup,nupkg,app | Out-Null
          & 7z x 'ESTUDEX-Setup.exe' '-osetup' -y | Out-Null
          $pkg = Get-ChildItem setup -Recurse -Filter 'blazerx-1.9.29-full.nupkg' | Select-Object -First 1
          if (-not $pkg) { throw 'H25 nupkg missing' }
          & 7z x $pkg.FullName '-onupkg' -y | Out-Null
          $asar = Get-ChildItem nupkg -Recurse -Filter 'app.asar' | Select-Object -First 1
          if (-not $asar) { throw 'H25 app.asar missing' }
          npx --yes @electron/asar extract $asar.FullName app
      - name: Inspect targeted Hotfix 26 anchors
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Slice($file,$start,$end){
            Write-Host "===== FILE $file L$start-L$end ====="
            $lines=Get-Content $file
            for($i=$start;$i -le [Math]::Min($end,$lines.Count);$i++){ Write-Host ("{0:D4}: {1}" -f $i,$lines[$i-1]) }
          }
          Slice 'app/public/js/estudex-v193-hotfix14-connectivity-media-room.js' 1 110
          Slice 'app/public/js/estudex-engine-media-preferences-bindings.js' 1 80
          Slice 'app/public/js/estudex-engine-media-bindings.js' 200 250
          Slice 'app/public/js/estudex-engine-socket-compat.js' 1 125
          Slice 'app/public/js/estudex-engine-socket-compat.js' 210 355
          Slice 'app/public/js/estudex-v193-cloud-social-v1926.js' 1 125
          Slice 'app/public/js/estudex-v193-cloud-social-v1926.js' 245 370
          Slice 'app/public/js/estudex-v193-spec-profile.js' 45 85
          Slice 'app/public/js/home.js' 350 390
          Slice 'app/public/js/home.js' 2450 2515
          Write-Host '===== SEARCH room screen button ids/classes ====='
          Get-ChildItem app/public -Recurse -File | Where-Object {$_.Extension -in '.html','.js'} | Select-String -Pattern 'roomScreen|screenButton|data-room.*screen|room.*screen' -CaseSensitive:$false -Context 2,3 | Select-Object -First 60 | ForEach-Object { Write-Host ("--- {0}:{1}`n{2}`n>>> {3}`n{4}" -f $_.Path,$_.LineNumber,($_.Context.PreContext -join "`n"),$_.Line,($_.Context.PostContext -join "`n")) }
